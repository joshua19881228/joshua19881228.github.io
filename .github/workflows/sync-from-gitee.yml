name: Sync from Gitee (Safe Mode)

on:
  schedule:
    - cron: '*/10 * * * *' # 每10分钟执行一次
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出 GitHub 仓库
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2. 配置 SSH 密钥（用于拉取 Gitee）
      - name: Setup SSH Key for Gitee
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # 3. 安装 rsync 并执行安全同步
      - name: Sync Files (Rsync)
        run: |
          # 安装 rsync 工具
          sudo apt-get update
          sudo apt-get install -y rsync

          # 定义 Gitee 仓库地址（需在 Secrets 中配置 GITEE_PAGES_REPO_URL）
          GITEE_PAGES_REPO_URL=${{ secrets.GITEE_PAGES_REPO_URL }}

          # 创建临时目录并克隆 Gitee 代码
          mkdir /tmp/gitee-source
          git clone $GITEE_PAGES_REPO_URL /tmp/gitee-source

          # 核心逻辑：使用 rsync 同步文件
          # --exclude='.github' 是关键，它保护了 GitHub Action 脚本不被覆盖
          # --delete 会删除 GitHub 上有但 Gitee 上没有的文件（保持单向一致）
          rsync -av --delete \
            --exclude='.github/' \
            --exclude='.git/' \
            /tmp/gitee-source/ ./ 

          # 清理临时文件
          rm -rf /tmp/gitee-source

      # 4. 推送更新到 GitHub
      - name: Push Changes
        run: |
          # 检查是否有文件变更
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m " chore: Sync from Gitee [$(date)]"
            git push origin HEAD:main # 请根据实际分支名修改 (main/master)
          else
            echo "No changes detected."
          fi
